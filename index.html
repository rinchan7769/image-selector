<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="選別ツール">
<meta name="theme-color" content="#0d0d10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>画像選別ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
:root{
  --bg:#0d0d10;
  --panel-l:#13131e;
  --panel-r:#0f1a16;
  --card:#1c1c2e;
  --mint:#3de8a0;
  --mint-dim:rgba(61,232,160,0.1);
  --mint-border:rgba(61,232,160,0.25);
  --purple:#9b6dff;
  --purple-dim:rgba(155,109,255,0.12);
  --text:#ddd6f8;
  --muted:#6a6285;
  --divider:rgba(255,255,255,0.07);
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
html,body{
  height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  overflow:hidden;overscroll-behavior:none;
}
#app{
  display:flex;flex-direction:column;
  height:100dvh;
  padding-top:var(--safe-top);
  padding-bottom:var(--safe-bottom);
  background:var(--bg);
}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px 8px;
  background:rgba(13,13,16,0.96);
  border-bottom:1px solid var(--divider);
  flex-shrink:0;
}
.topbar-title{font-size:15px;font-weight:700;color:var(--text);flex:1;letter-spacing:0.3px;}
.chip{
  background:var(--purple-dim);color:var(--purple);
  border:1px solid rgba(155,109,255,0.2);
  border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;
  white-space:nowrap;
}
.chip.m{background:var(--mint-dim);color:var(--mint);border-color:var(--mint-border);}
.add-btn{
  display:flex;align-items:center;gap:5px;
  background:var(--purple);color:#fff;
  border:none;border-radius:9px;padding:7px 12px;
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
}

/* SPLIT */
.split{display:flex;flex:1;overflow:hidden;}
.pane{display:flex;flex-direction:column;overflow:hidden;}
.pane-l{width:55%;border-right:1px solid var(--divider);background:var(--panel-l);}
.pane-r{width:45%;background:var(--panel-r);}

/* PANE HEADER */
.pane-hdr{
  padding:8px 10px;display:flex;align-items:center;gap:5px;
  border-bottom:1px solid var(--divider);flex-shrink:0;
  background:rgba(0,0,0,0.18);
}
.pane-label{font-size:11px;color:var(--muted);font-weight:500;flex:1;}
.mini-btn{
  font-size:10px;color:var(--muted);padding:3px 7px;
  border:1px solid var(--divider);border-radius:6px;
  background:transparent;cursor:pointer;white-space:nowrap;
}

/* GRIDS */
.pool-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:3px;padding:5px;overflow-y:auto;flex:1;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.sel-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:3px;padding:5px;overflow-y:auto;flex:1;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.sel-grid.drag-over{
  background:var(--mint-dim);
  outline:2px dashed var(--mint);outline-offset:-3px;border-radius:6px;
}

/* THUMB */
.thumb{
  position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;
  background:var(--card);border:2px solid transparent;
  transition:border-color 0.12s;touch-action:none;user-select:none;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.thumb.sel{border-color:var(--mint);}
.chk{
  position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.3);
  display:flex;align-items:center;justify-content:center;
}
.thumb.sel .chk{background:var(--mint);border-color:var(--mint);}
.chk-icon{display:none;width:11px;height:11px;}
.thumb.sel .chk-icon{display:block;}
.seq-badge{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,0.72);
  color:var(--mint);font-size:10px;font-weight:700;
  text-align:center;padding:3px 0;letter-spacing:0.5px;
}

/* DRAG GHOST */
.ghost{
  position:fixed;pointer-events:none;z-index:9999;
  width:72px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;
  border:2px solid var(--mint);opacity:0.88;
  transform:scale(1.1);transition:none;
}
.ghost img{width:100%;height:100%;object-fit:cover;display:block;}

/* EMPTY */
.empty{
  grid-column:1/-1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;color:var(--muted);font-size:11px;text-align:center;
  padding:24px 12px;min-height:120px;
}
.empty-icon{font-size:26px;opacity:0.5;}

/* UPLOAD ZONE */
.upload-zone{
  grid-column:1/-1;margin:4px 0;
  border:1.5px dashed rgba(155,109,255,0.3);
  border-radius:10px;padding:24px 12px;text-align:center;cursor:pointer;
  background:var(--purple-dim);
}
.upload-zone p{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
.upload-zone .uz-icon{font-size:26px;}

/* BOTTOM BAR */
.bottom-bar{
  padding:10px 14px;
  border-top:1px solid var(--divider);
  background:rgba(13,13,16,0.97);
  display:flex;gap:8px;align-items:center;flex-shrink:0;
}
.num-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.num-label{font-size:11px;color:var(--muted);}
.num-input{
  width:46px;background:var(--card);border:1px solid var(--divider);
  border-radius:7px;color:var(--text);font-size:13px;font-weight:700;
  padding:5px 6px;text-align:center;
}
.num-input:focus{outline:none;border-color:var(--mint);}
.reset-btn{
  width:38px;height:38px;border-radius:9px;flex-shrink:0;
  border:1px solid rgba(255,90,90,0.2);background:rgba(255,90,90,0.07);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.reset-btn svg{width:15px;height:15px;stroke:#ff7070;}
.reset-btn:disabled{opacity:0.25;}
.dl-btn{
  flex:1;background:var(--mint);color:#071a10;
  border:none;border-radius:10px;padding:11px;
  font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.dl-btn:disabled{opacity:0.25;cursor:default;}
.dl-btn svg{width:14px;height:14px;stroke:#071a10;flex-shrink:0;}

/* TOAST */
.toast{
  position:fixed;bottom:calc(80px + var(--safe-bottom));
  left:50%;transform:translateX(-50%) translateY(8px);
  background:#1a2e22;border:1px solid var(--mint-border);
  color:var(--mint);padding:8px 18px;border-radius:20px;
  font-size:12px;font-weight:500;opacity:0;
  transition:opacity 0.2s,transform 0.2s;z-index:9998;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

input[type=file]{display:none;}

/* PREVIEW MODAL */
.preview-modal{
  position:fixed;inset:0;z-index:10000;
  background:rgba(5,5,8,0.96);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
}
.preview-modal.on{display:flex;}
.pv-close{
  position:absolute;top:calc(14px + var(--safe-top));right:14px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.08);border:none;color:var(--text);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.pv-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:64px;border-radius:10px;
  background:rgba(255,255,255,0.06);border:none;color:var(--text);
  font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.pv-nav:disabled{opacity:0.2;}
.pv-prev{left:8px;}
.pv-next{right:8px;}
.pv-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding:0 60px;}
#pv-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}
.pv-bottom{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:14px 20px calc(18px + var(--safe-bottom));width:100%;
}
.pv-counter{font-size:12px;color:var(--muted);}
.pv-select-btn{
  background:var(--purple);color:#fff;border:none;border-radius:10px;
  padding:11px 28px;font-size:13px;font-weight:700;cursor:pointer;
}
.pv-select-btn.sel{background:var(--mint);color:#071a10;}

/* DRIVE BROWSER */
.drive-modal{
  position:fixed;inset:0;z-index:10001;
  background:var(--bg);
  display:none;flex-direction:column;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
}
.drive-modal.on{display:flex;}
.dv-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-bottom:1px solid var(--divider);
  background:rgba(13,13,16,0.96);flex-shrink:0;
}
.dv-nav-btn{
  background:transparent;border:none;color:var(--mint);
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;padding:4px 2px;
}
.dv-nav-btn:disabled{opacity:0.25;}
.dv-path{flex:1;font-size:13px;font-weight:700;color:var(--text);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dv-close{
  width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.08);
  border:none;color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.dv-search-bar{
  display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--divider);
  background:rgba(0,0,0,0.15);flex-shrink:0;
}
.dv-search-bar input{
  flex:1;background:var(--card);border:1px solid var(--divider);border-radius:8px;
  padding:7px 10px;color:var(--text);font-size:13px;
}
.dv-search-bar input:focus{outline:none;border-color:var(--mint);}
.dv-search-bar button{
  background:var(--purple);border:none;border-radius:8px;color:#fff;
  padding:0 14px;font-size:14px;cursor:pointer;flex-shrink:0;
}
.dv-list{flex:1;overflow-y:auto;padding:6px 10px;-webkit-overflow-scrolling:touch;}
.dv-loading{padding:24px;text-align:center;color:var(--muted);font-size:12px;}
.dv-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 8px;border-bottom:1px solid var(--divider);cursor:pointer;
}
.dv-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
.dv-thumb{
  width:40px;height:40px;border-radius:6px;overflow:hidden;background:var(--card);flex-shrink:0;
}
.dv-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.dv-name{flex:1;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dv-arrow{color:var(--muted);font-size:16px;flex-shrink:0;}
.dv-check{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;
}
.dv-row.sel .dv-check{background:var(--mint);border-color:var(--mint);}
.dv-check-icon{display:none;width:11px;height:11px;}
.dv-row.sel .dv-check-icon{display:block;}
.dv-bottom{
  display:flex;align-items:center;gap:10px;padding:10px 14px calc(12px + var(--safe-bottom));
  border-top:1px solid var(--divider);background:rgba(13,13,16,0.97);flex-shrink:0;
}
.dv-selall-btn{
  font-size:11px;color:var(--muted);padding:7px 10px;
  border:1px solid var(--divider);border-radius:7px;background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.dv-counter{font-size:12px;color:var(--muted);flex:1;}
.dv-confirm-btn{
  background:var(--mint);color:#071a10;border:none;border-radius:10px;
  padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;
}
.dv-confirm-btn:disabled{opacity:0.25;cursor:default;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="topbar-title">✦ 画像選別</span>
    <span class="chip" id="c-total">0枚</span>
    <span class="chip m" id="c-sel">選択0</span>
    <label for="fi" class="add-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      追加
    </label>
    <input type="file" id="fi" multiple accept="image/*">
    <button class="add-btn" id="gdrive-btn" onclick="openDrivePicker()" style="background:var(--mint);color:#071a10;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 15l4-8h8l4 8M4 15l4 6h8l4-6M4 15h16"/></svg>
      Drive
    </button>
  </div>

  <div class="split">
    <div class="pane pane-l">
      <div class="pane-hdr">
        <span class="pane-label">📁 プール</span>
        <button class="mini-btn" onclick="selAll()">全選択</button>
        <button class="mini-btn" onclick="deselAll()">解除</button>
      </div>
      <div class="pool-grid" id="pool-grid"></div>
    </div>
    <div class="pane pane-r">
      <div class="pane-hdr">
        <span class="pane-label">✅ 選別済み</span>
        <span style="font-size:10px;color:var(--muted);">長押→右ドラッグ</span>
      </div>
      <div class="sel-grid" id="sel-grid"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="num-wrap">
      <span class="num-label">No.</span>
      <input class="num-input" type="number" id="start-num" value="1" min="1" max="999">
    </div>
    <button class="reset-btn" id="reset-btn" onclick="resetSel()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
      </svg>
    </button>
    <button class="dl-btn" id="dl-btn" onclick="doDownload()" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      ダウンロード
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="preview-modal" id="preview-modal">
  <button class="pv-close" onclick="closePreview()">✕</button>
  <button class="pv-nav pv-prev" id="pv-prev" onclick="prevPreview()">‹</button>
  <div class="pv-img-wrap"><img id="pv-img" src=""></div>
  <button class="pv-nav pv-next" id="pv-next" onclick="nextPreview()">›</button>
  <div class="pv-bottom">
    <span class="pv-counter" id="pv-counter"></span>
    <button class="pv-select-btn" id="pv-select-btn" onclick="togglePreviewSel()">選別に追加</button>
  </div>
</div>

<div class="drive-modal" id="drive-modal">
  <div class="dv-header">
    <button class="dv-nav-btn" id="dv-back-btn" onclick="driveGoBack()">‹ 戻る</button>
    <span class="dv-path" id="dv-path">マイドライブ</span>
    <button class="dv-close" onclick="closeDriveBrowser()">✕</button>
  </div>
  <div class="dv-search-bar">
    <input type="text" id="dv-search-input" placeholder="フォルダ名で検索（例: Text2Img）">
    <button onclick="driveSearch()">検索</button>
  </div>
  <div class="dv-list" id="dv-list"></div>
  <div class="dv-bottom">
    <button class="dv-selall-btn" onclick="driveSelectAllInView()">全選択</button>
    <span class="dv-counter" id="dv-counter">選択0件</span>
    <button class="dv-confirm-btn" id="dv-confirm-btn" onclick="confirmDriveSelection()" disabled>追加</button>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" onload="gisLoaded()" async defer></script>
<script>

const GOOGLE_CLIENT_ID = '915191077344-a2nb12sektqe2n8v0d67pd1hjuhteh3u.apps.googleusercontent.com';
const GOOGLE_API_KEY = 'AIzaSyB6QyRYMzdlZhxIGf15p0K9i3WofLrUNyI';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';

let images = [];
let selected = [];
let ghost = null;
let draggingId = null;
let dragStartX = 0, dragStartY = 0;
let dragMoved = false;
let longPressTimer = null;
const LONG_PRESS_MS = 160;

const poolGrid = document.getElementById('pool-grid');
const selGrid  = document.getElementById('sel-grid');

/* ── RENDER ── */
function getStart(){ return parseInt(document.getElementById('start-num').value)||1; }

function render(){ renderPool(); renderSel(); updateChips(); }

function renderPool(){
  poolGrid.innerHTML = '';
  if(!images.length){
    const wrap = document.createElement('div');
    wrap.className = 'upload-zone';
    wrap.innerHTML = `<div class="uz-icon">🖼️</div><p><strong style="color:var(--purple)">タップして画像を追加</strong><br>JPG・PNG・HEIC対応</p>`;
    wrap.addEventListener('click', ()=> document.getElementById('fi').click());
    poolGrid.appendChild(wrap);
    return;
  }
  images.forEach(img => {
    const isSel = selected.includes(img.id);
    const el = createThumb(img, isSel, false);
    poolGrid.appendChild(el);
  });
}

function renderSel(){
  selGrid.innerHTML = '';
  if(!selected.length){
    const el = document.createElement('div');
    el.className = 'empty';
    el.innerHTML = `<div class="empty-icon">👉</div><p>長押しして<br>ここへドラッグ</p>`;
    selGrid.appendChild(el);
    return;
  }
  const start = getStart();
  selected.forEach((id, i) => {
    const img = images.find(x => x.id === id);
    if(!img) return;
    const el = createThumb(img, true, true, start + i);
    selGrid.appendChild(el);
  });
}

function createThumb(img, isSel, inSel, seqNum){
  const div = document.createElement('div');
  div.className = 'thumb' + (isSel ? ' sel' : '');
  div.dataset.id = img.id;
  div.innerHTML = `
    <img src="${img.url}" draggable="false" loading="lazy">
    ${!inSel ? `<div class="chk"><svg class="chk-icon" viewBox="0 0 24 24" fill="none" stroke="#071a10" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>` : ''}
    ${seqNum !== undefined ? `<div class="seq-badge">${String(seqNum).padStart(3,'0')}</div>` : ''}
  `;
  if(!inSel){
    div.querySelector('img').addEventListener('click', e => { if(dragMoved) return; openPreview(img.id); });
    div.querySelector('.chk').addEventListener('click', e => { e.stopPropagation(); toggleSel(img.id); });
    div.addEventListener('touchstart', e => onTouchStart(e, img.id), {passive:true});
    div.addEventListener('touchmove',  e => onTouchMove(e),  {passive:false});
    div.addEventListener('touchend',   e => onTouchEnd(e),   {passive:true});
    div.addEventListener('touchcancel',()=> cancelDrag(), {passive:true});
    div.addEventListener('mousedown',  e => onMouseDown(e, img.id));
  } else {
    div.style.cursor = 'pointer';
    div.addEventListener('click', () => { removeSel(img.id); toast('選別から除外しました'); });
  }
  return div;
}

function updateChips(){
  document.getElementById('c-total').textContent = images.length + '枚';
  document.getElementById('c-sel').textContent   = '選択' + selected.length;
  const has = selected.length > 0;
  document.getElementById('dl-btn').disabled    = !has;
  document.getElementById('reset-btn').disabled = !has;
}

/* ── SELECT ── */
function toggleSel(id){
  if(selected.includes(id)){ removeSel(id); toast('除外しました'); }
  else { selected.push(id); renderSel(); updateChips(); toast('選別に追加 ✓'); renderPool(); }
}
function removeSel(id){ selected = selected.filter(x => x !== id); render(); }
function selAll(){ selected = images.map(x => x.id); render(); toast('全て選択しました'); }
function deselAll(){ selected = []; render(); }
function resetSel(){ selected = []; render(); toast('リセットしました'); }

document.getElementById('start-num').addEventListener('input', () => renderSel());

/* ── TOUCH DRAG ── */
function onTouchStart(e, id){
  dragMoved = false; draggingId = null;
  const t = e.touches[0];
  dragStartX = t.clientX; dragStartY = t.clientY;
  longPressTimer = setTimeout(() => startDrag(id, t.clientX, t.clientY), LONG_PRESS_MS);
}
function onTouchMove(e){
  const t = e.touches[0];
  const dx = t.clientX - dragStartX, dy = t.clientY - dragStartY;
  if(Math.abs(dx) > 5 || Math.abs(dy) > 5){
    clearTimeout(longPressTimer);
    if(draggingId){ e.preventDefault(); moveGhost(t.clientX, t.clientY); checkOver(t.clientX, t.clientY); }
    else { dragMoved = true; }
  }
}
function onTouchEnd(e){
  clearTimeout(longPressTimer);
  if(draggingId){ const t = e.changedTouches[0]; dropAt(t.clientX, t.clientY); }
}

/* ── MOUSE DRAG ── */
function onMouseDown(e, id){
  if(e.button !== 0) return;
  dragMoved = false; draggingId = null;
  dragStartX = e.clientX; dragStartY = e.clientY;
  longPressTimer = setTimeout(() => startDrag(id, e.clientX, e.clientY), LONG_PRESS_MS);
  window.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
}
function onMouseMove(e){
  const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
  if(Math.abs(dx) > 5 || Math.abs(dy) > 5){
    clearTimeout(longPressTimer);
    if(draggingId){ moveGhost(e.clientX, e.clientY); checkOver(e.clientX, e.clientY); }
    else { dragMoved = true; }
  }
}
function onMouseUp(e){
  clearTimeout(longPressTimer);
  window.removeEventListener('mousemove', onMouseMove);
  window.removeEventListener('mouseup', onMouseUp);
  if(draggingId) dropAt(e.clientX, e.clientY);
}

/* ── DRAG CORE ── */
function startDrag(id, x, y){
  draggingId = id; dragMoved = true;
  const img = images.find(i => i.id === id);
  if(!img) return;
  ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.innerHTML = `<img src="${img.url}">`;
  ghost.style.left = (x - 36) + 'px';
  ghost.style.top  = (y - 48) + 'px';
  document.body.appendChild(ghost);
  if(navigator.vibrate) navigator.vibrate(10);
}
function moveGhost(x, y){
  if(!ghost) return;
  ghost.style.left = (x - 36) + 'px';
  ghost.style.top  = (y - 48) + 'px';
}
function checkOver(x, y){
  const r = selGrid.getBoundingClientRect();
  selGrid.classList.toggle('drag-over', x >= r.left && x <= r.right && y >= r.top && y <= r.bottom);
}
function dropAt(x, y){
  if(ghost){ ghost.remove(); ghost = null; }
  selGrid.classList.remove('drag-over');
  const r = selGrid.getBoundingClientRect();
  const inRight = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  if(inRight && draggingId){
    if(!selected.includes(draggingId)){ selected.push(draggingId); render(); toast('選別に追加 ✓'); }
    else { toast('既に選別済みです'); }
  }
  draggingId = null; dragMoved = false;
}
function cancelDrag(){
  clearTimeout(longPressTimer);
  if(ghost){ ghost.remove(); ghost = null; }
  selGrid.classList.remove('drag-over');
  draggingId = null;
}

/* ── FILES ── */
function loadFiles(files){
  [...files].filter(f => f.type.startsWith('image/')).forEach(f => {
    images.push({ id: Math.random().toString(36).slice(2), url: URL.createObjectURL(f), file: f, name: f.name });
  });
  render();
}
document.getElementById('fi').addEventListener('change', e => { loadFiles(e.target.files); e.target.value = ''; });

/* ── DOWNLOAD ── */
async function doDownload(){
  const btn = document.getElementById('dl-btn');
  btn.disabled = true; btn.textContent = '保存中...';
  const start = getStart();
  for(let i = 0; i < selected.length; i++){
    const img = images.find(x => x.id === selected[i]);
    if(!img) continue;
    const ext = img.name.split('.').pop() || 'jpg';
    const num = String(start + i).padStart(3, '0');
    const a = document.createElement('a');
    a.href = img.url;
    a.download = `${num}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    await new Promise(r => setTimeout(r, 300));
  }
  btn.disabled = false;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#071a10" stroke-width="2.5" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> ダウンロード`;
}

/* ── PREVIEW ── */
let previewIndex = -1;
function openPreview(id){
  previewIndex = images.findIndex(x => x.id === id);
  if(previewIndex < 0) return;
  showPreview();
  document.getElementById('preview-modal').classList.add('on');
}
function closePreview(){
  document.getElementById('preview-modal').classList.remove('on');
}
function showPreview(){
  const img = images[previewIndex];
  if(!img) return;
  document.getElementById('pv-img').src = img.url;
  document.getElementById('pv-counter').textContent = (previewIndex + 1) + ' / ' + images.length;
  document.getElementById('pv-prev').disabled = previewIndex <= 0;
  document.getElementById('pv-next').disabled = previewIndex >= images.length - 1;
  const isSel = selected.includes(img.id);
  const btn = document.getElementById('pv-select-btn');
  btn.textContent = isSel ? '選別から除外' : '選別に追加';
  btn.classList.toggle('sel', isSel);
}
function prevPreview(){ if(previewIndex > 0){ previewIndex--; showPreview(); } }
function nextPreview(){ if(previewIndex < images.length - 1){ previewIndex++; showPreview(); } }
function togglePreviewSel(){
  const img = images[previewIndex];
  if(!img) return;
  toggleSel(img.id);
  showPreview();
}

/* ── TOAST ── */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

/* ── GOOGLE DRIVE BROWSER ── */
let tokenClient = null;
let accessToken = null;
let gisReady = false;
let driveStack = [];
let driveCurrent = { id: 'root', name: 'マイドライブ' };
let driveSelected = new Map();

function gisLoaded(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_DRIVE_SCOPE,
    callback: '',
  });
  gisReady = true;
}

function openDrivePicker(){
  if(!gisReady){ toast('読み込み中です。少し待って再度お試しください'); return; }
  tokenClient.callback = (resp) => {
    if(resp.error){ toast('Google認証に失敗しました'); return; }
    accessToken = resp.access_token;
    driveStack = [];
    driveCurrent = { id: 'root', name: 'マイドライブ' };
    driveSelected.clear();
    document.getElementById('drive-modal').classList.add('on');
    loadDriveFolder();
  };
  tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
}

function closeDriveBrowser(){
  document.getElementById('drive-modal').classList.remove('on');
}

function driveGoBack(){
  if(!driveStack.length) return;
  driveCurrent = driveStack.pop();
  loadDriveFolder();
}

async function loadDriveFolder(){
  document.getElementById('dv-search-input').value = '';
  document.getElementById('dv-path').textContent = driveCurrent.name;
  document.getElementById('dv-back-btn').disabled = driveStack.length === 0;
  const list = document.getElementById('dv-list');
  list.innerHTML = '<div class="dv-loading">読み込み中...</div>';
  try{
    const q = encodeURIComponent(`'${driveCurrent.id}' in parents and trashed = false and (mimeType = 'application/vnd.google-apps.folder' or mimeType contains 'image/')`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType,thumbnailLink)&pageSize=200&orderBy=folder,name`, {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if(!res.ok) throw new Error('list failed');
    const json = await res.json();
    renderDriveList(json.files || []);
  }catch(e){
    list.innerHTML = '<div class="dv-loading">読み込みに失敗しました</div>';
  }
}

function renderDriveList(items){
  const list = document.getElementById('dv-list');
  list.innerHTML = '';
  if(!items.length){
    list.innerHTML = '<div class="dv-loading">このフォルダは空です</div>';
    return;
  }
  items.forEach(item => {
    const isFolder = item.mimeType === 'application/vnd.google-apps.folder';
    const row = document.createElement('div');
    row.className = 'dv-row' + (!isFolder && driveSelected.has(item.id) ? ' sel' : '');
    if(isFolder){
      row.innerHTML = `<div class="dv-icon">📁</div><div class="dv-name">${item.name}</div><div class="dv-arrow">›</div>`;
      row.addEventListener('click', () => {
        driveStack.push(driveCurrent);
        driveCurrent = { id: item.id, name: item.name };
        loadDriveFolder();
      });
    } else {
      row.className += ' dv-image-row';
      row.dataset.id = item.id;
      row.dataset.name = item.name;
      row.innerHTML = `
        <div class="dv-thumb"><img loading="lazy"></div>
        <div class="dv-name">${item.name}</div>
        <div class="dv-check"><svg class="dv-check-icon" viewBox="0 0 24 24" fill="none" stroke="#071a10" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
      `;
      row.addEventListener('click', () => {
        if(driveSelected.has(item.id)){ driveSelected.delete(item.id); row.classList.remove('sel'); }
        else { driveSelected.set(item.id, { id: item.id, name: item.name }); row.classList.add('sel'); }
        updateDriveCounter();
      });
      if(item.thumbnailLink){
        fetchDriveThumb(item.thumbnailLink).then(url => { if(url) row.querySelector('img').src = url; });
      }
    }
    list.appendChild(row);
  });
  updateDriveCounter();
}

document.getElementById('dv-search-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') driveSearch();
});

async function driveSearch(){
  const q = document.getElementById('dv-search-input').value.trim();
  if(!q) return;
  const list = document.getElementById('dv-list');
  list.innerHTML = '<div class="dv-loading">検索中...</div>';
  document.getElementById('dv-path').textContent = '検索: ' + q;
  try{
    const query = encodeURIComponent(`name contains '${q.replace(/'/g, "\\'")}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)&pageSize=50&corpora=allDrives&includeItemsFromAllDrives=true&supportsAllDrives=true`, {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if(!res.ok) throw new Error('search failed');
    const json = await res.json();
    renderDriveSearchResults(json.files || []);
  }catch(e){
    list.innerHTML = '<div class="dv-loading">検索に失敗しました</div>';
  }
}

function renderDriveSearchResults(items){
  const list = document.getElementById('dv-list');
  list.innerHTML = '';
  if(!items.length){ list.innerHTML = '<div class="dv-loading">見つかりませんでした</div>'; return; }
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'dv-row';
    row.innerHTML = `<div class="dv-icon">📁</div><div class="dv-name">${item.name}</div><div class="dv-arrow">›</div>`;
    row.addEventListener('click', () => {
      driveStack.push(driveCurrent);
      driveCurrent = { id: item.id, name: item.name };
      loadDriveFolder();
    });
    list.appendChild(row);
  });
}

async function fetchDriveThumb(url){
  try{
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
    if(!res.ok) return null;
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }catch(e){ return null; }
}

function driveSelectAllInView(){
  document.querySelectorAll('#dv-list .dv-image-row').forEach(row => {
    const id = row.dataset.id, name = row.dataset.name;
    driveSelected.set(id, { id, name });
    row.classList.add('sel');
  });
  updateDriveCounter();
}

function updateDriveCounter(){
  const n = driveSelected.size;
  document.getElementById('dv-counter').textContent = '選択' + n + '件';
  document.getElementById('dv-confirm-btn').disabled = n === 0;
}

async function confirmDriveSelection(){
  const docs = [...driveSelected.values()];
  if(!docs.length) return;
  closeDriveBrowser();
  toast('読み込み中...');
  const loaded = await Promise.all(docs.map(doc => fetchDriveFile(doc)));
  images.push(...loaded.filter(Boolean));
  render();
  toast(loaded.filter(Boolean).length + '枚追加しました');
}

async function fetchDriveFile(doc){
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${doc.id}?alt=media`, {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if(!res.ok) throw new Error('drive fetch failed');
    const blob = await res.blob();
    return { id: Math.random().toString(36).slice(2), url: URL.createObjectURL(blob), file: blob, name: doc.name };
  }catch(e){
    toast(doc.name + ' の読み込みに失敗しました');
    return null;
  }
}

/* ── SERVICE WORKER ── */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

render();
</script>
